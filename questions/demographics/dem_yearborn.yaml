name: dem_yearborn
title: Respondent's birth year
text: In what year were you born?
intent: Construct household composition (children)
concept: demographic_information
universe: all_respondents
number:
  min: 1900
  max: 2023
note: Respondents were allowed to enter 4 numeric characters. If a respondent gave a number less than 1900, they were prompted with the message ‘Please enter the year you were born using four digits.’