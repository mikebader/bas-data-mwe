name: dem_prgmed
title: Received Medicaid or similar benefits
text: |
  The next question is about public benefits you or your family may have received in the past 12 months. Did you or anyone in your family receive the following benefits at any time since {{NAME OF CURRENT MONTH}} 2022? Please include benefits received by you, your spouse or partner and any of your children or stepchildren under 19 who usually live with you.
  
  Medicaid, Medical Assistance, the Maryland Children’s Health Program or any kind of state or government-sponsored assistance plan based on income or disability
intent: Measure respondent's receipt of public benefits (healthcare)
concept: demographic_information
universe: all_respondents
responses: yes