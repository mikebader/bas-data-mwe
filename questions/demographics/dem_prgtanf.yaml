name: dem_prgtanf
title: Received TANF benefits
text: |
  The next question is about public benefits you or your family may have received in the past 12 months. Did you or anyone in your family receive the following benefits at any time since {{NAME OF CURRENT MONTH}} 2022? Please include benefits received by you, your spouse or partner and any of your children or stepchildren under 19 who usually live with you.
  
  Temporary Assistance for Needy Families (TANF), sometimes known as cash welfare
intent: Measure respondent's receipt of public benefits (TANF)
